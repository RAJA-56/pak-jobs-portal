<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakJobs Hub | Direct Local & Remote Job Search Engine</title>
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --accent: #22c55e;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --card-radius: 12px;
        }

        * { box-sizing: border-box; transition: all 0.25s ease-in-out; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            padding: 3rem 1rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: var(--primary);
        }

        header p {
            margin: 0.5rem 0 0;
            color: var(--text-muted);
            font-size: 1rem;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Sponsor Box */
        .sponsor-card {
            background: linear-gradient(90deg, rgba(30,58,138,0.4) 0%, rgba(15,23,42,0.6) 100%);
            border: 1px dashed var(--primary);
            border-radius: var(--card-radius);
            padding: 1.2rem;
            text-align: center;
            margin-bottom: 2rem;
            backdrop-filter: blur(5px);
        }

        .sponsor-card a {
            color: var(--primary);
            font-weight: bold;
            text-decoration: none;
        }

        /* Filter Controls */
        .controls {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 2rem;
            background: var(--surface);
            padding: 1.25rem;
            border-radius: var(--card-radius);
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }

        /* Job Cards & Animations */
        .job-card {
            background: var(--surface);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            border: 1px solid var(--border);
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .job-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
            box-shadow: 0 12px 20px -8px rgba(0,0,0,0.5);
        }

        .job-card.featured {
            border-left: 4px solid var(--accent);
            background: linear-gradient(90deg, rgba(34,197,94,0.05) 0%, var(--surface) 100%);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }

        .job-title {
            margin: 0;
            font-size: 1.2rem;
            color: var(--text);
            font-weight: 600;
        }

        .company-name {
            color: var(--primary);
            font-weight: 500;
            margin-top: 4px;
            font-size: 0.95rem;
        }

        .job-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .badge {
            background: rgba(255,255,255,0.05);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.82rem;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 1rem;
        }

        .btn-toggle {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-toggle:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .apply-btn {
            background: var(--primary);
            color: #0f172a;
            text-decoration: none;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
        }

        .apply-btn:hover {
            background: var(--primary-hover);
            color: white;
        }

        /* Description Expand Drawer */
        .job-desc {
            display: none;
            margin-top: 1.2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.92rem;
            color: #cbd5e1;
            max-height: 250px;
            overflow-y: auto;
        }

        .job-desc.open {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 250px; }
        }

        @media (max-width: 640px) {
            .controls { grid-template-columns: 1fr; }
            .job-header { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <h1>PakJobs Hub</h1>
        <p>Live Physical Jobs in Pakistan & Worldwide Remote Openings</p>
    </header>

    <div class="container">
        
        <div class="sponsor-card">
            📢 <strong>Hiring for your company or team?</strong> Feature your opening at the top of PakJobs Hub for PKR 3,000 / $10. 
            <a href="https://wa.me/923000000000?text=Hi,%20I%20want%20to%20feature%20a%20job" target="_blank">Post a Paid Job via WhatsApp →</a>
        </div>

        <div class="controls">
            <input type="text" id="keyword" placeholder="Search keywords, roles, companies..." onkeyup="filterJobs()">
            
            <select id="citySelect" onchange="filterJobs()">
                <option value="All">All Locations</option>
                <option value="Lahore">Lahore</option>
                <option value="Karachi">Karachi</option>
                <option value="Islamabad">Islamabad</option>
                <option value="Rawalpindi">Rawalpindi</option>
                <option value="Faisalabad">Faisalabad</option>
                <option value="Remote / Global">Remote (Global)</option>
            </select>

            <select id="catSelect" onchange="filterJobs()">
                <option value="All">All Categories</option>
                <option value="Python / Backend">Python & Backend</option>
                <option value="Web Development">Web Development</option>
                <option value="Mobile Development">Mobile Apps (Android/iOS)</option>
                <option value="Data & AI">AI & Data Science</option>
                <option value="Design & Creative">UI/UX & Design</option>
                <option value="Marketing & Sales">Marketing & SEO</option>
                <option value="Customer Support">Customer Support</option>
                <option value="Admin & Operations">Admin & Management</option>
            </select>
        </div>

        <div id="jobListings">Loading job opportunities...</div>

    </div>

    <script>
        let allJobs = [];

        fetch('jobs.json')
            .then(res => res.json())
            .then(data => {
                allJobs = data;
                renderJobs(allJobs);
            })
            .catch(() => {
                document.getElementById('jobListings').innerHTML = '<p style="text-align:center;">Error loading data. Run your scraper workflow on GitHub.</p>';
            });

        function renderJobs(jobs) {
            const container = document.getElementById('jobListings');
            container.innerHTML = '';

            if (jobs.length === 0) {
                container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No jobs matched your search criteria.</p>';
                return;
            }

            jobs.forEach((job, index) => {
                const card = document.createElement('div');
                card.className = `job-card ${job.is_featured ? 'featured' : ''}`;
                card.innerHTML = `
                    <div class="job-header">
                        <div>
                            <h3 class="job-title">${job.title}</h3>
                            <div class="company-name">${job.company}</div>
                        </div>
                    </div>
                    <div class="job-meta">
                        <span class="badge">📍 ${job.city}</span>
                        <span class="badge">🏷️ ${job.category}</span>
                        <span class="badge">🌐 Source: ${job.source}</span>
                    </div>
                    <div class="actions">
                        <button class="btn-toggle" onclick="toggleDesc(${index})">📄 View Description</button>
                        <a href="${job.url}" target="_blank" class="apply-btn">Apply Direct →</a>
                    </div>
                    <div class="job-desc" id="desc-${index}">
                        ${job.description || "Click 'Apply Direct' above to read the full job requirements and submit your application on the hiring platform."}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleDesc(id) {
            const el = document.getElementById(`desc-${id}`);
            el.classList.toggle('open');
        }

        function filterJobs() {
            const keyword = document.getElementById('keyword').value.toLowerCase();
            const city = document.getElementById('citySelect').value;
            const category = document.getElementById('catSelect').value;

            const filtered = allJobs.filter(job => {
                const matchesKeyword = job.title.toLowerCase().includes(keyword) || job.company.toLowerCase().includes(keyword);
                const matchesCity = (city === 'All' || job.city === city);
                const matchesCat = (category === 'All' || job.category === category);
                return matchesKeyword && matchesCity && matchesCat;
            });

            renderJobs(filtered);
        }
    </script>
</body>
</html>
