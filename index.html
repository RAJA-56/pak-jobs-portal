<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PakJobs Hub | Local Physical & Worldwide Remote Jobs</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --radius: 10px;
        }

        * { box-sizing: border-box; transition: all 0.2s ease; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background: #1e1b4b;
            padding: 2.5rem 1.5rem;
            text-align: center;
            border-bottom: 1px solid var(--border);
        }

        header h1 { margin: 0; color: var(--accent); font-size: 2.2rem; }
        header p { margin: 0.5rem 0 0; color: var(--text-sub); }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        .sponsor-bar {
            background: linear-gradient(90deg, #1e3a8a 0%, #0f172a 100%);
            border: 1px dashed var(--accent);
            border-radius: var(--radius);
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .sponsor-bar a { color: var(--accent); font-weight: bold; text-decoration: none; }

        .controls {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 2rem;
            background: var(--card-bg);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        input, select {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            outline: none;
        }

        input:focus, select:focus { border-color: var(--accent); }

        .job-grid { display: flex; flex-direction: column; gap: 1rem; }

        .job-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.25rem 1.5rem;
            border: 1px solid var(--border);
            width: 100%;
        }

        .job-card:hover { border-color: #475569; }

        .job-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
        .job-title { margin: 0; font-size: 1.2rem; color: var(--text-main); }
        .company-name { color: var(--accent); font-weight: 500; margin-top: 4px; }

        .job-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 0.8rem 0; }
        .tag { background: rgba(255,255,255,0.06); padding: 3px 10px; border-radius: 4px; font-size: 0.82rem; color: var(--text-sub); }

        .job-actions { display: flex; gap: 10px; margin-top: 1rem; }

        .btn-desc {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-apply {
            background: var(--accent);
            color: #0f172a;
            text-decoration: none;
            padding: 0.4rem 1.1rem;
            border-radius: 6px;
            font-weight: 600;
        }

        .btn-apply:hover { background: var(--accent-hover); color: white; }

        .desc-box {
            display: none;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            color: #cbd5e1;
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .desc-box.active { display: block; }

        @media (max-width: 768px) {
            .controls { grid-template-columns: 1fr; }
            .job-top { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <h1>PakJobs Hub</h1>
        <p>Real-Time Local Jobs in Pakistan & Worldwide Remote Roles</p>
    </header>

    <div class="wrapper">
        <div class="sponsor-bar">
            📢 <strong>Are you an employer?</strong> Promote your job opening here to reach thousands of Pakistani candidates. 
            <a href="https://wa.me/923000000000?text=I%20want%20to%20post%20a%20job" target="_blank">Contact via WhatsApp →</a>
        </div>

        <div class="controls">
            <input type="text" id="searchKeyword" placeholder="Search keywords, roles, companies..." onkeyup="filterJobs()">
            
            <select id="citySelect" onchange="filterJobs()">
                <option value="All">All Cities / Remote</option>
                <option value="Lahore">Lahore</option>
                <option value="Karachi">Karachi</option>
                <option value="Islamabad">Islamabad</option>
                <option value="Remote / Global">Remote (Worldwide)</option>
            </select>

            <select id="catSelect" onchange="filterJobs()">
                <option value="All">All Categories</option>
                <option value="Python / Backend">Python & Backend</option>
                <option value="Web Development">Web Development</option>
                <option value="Design & Creative">Design & Creative</option>
                <option value="Marketing & Sales">Marketing & Sales</option>
                <option value="Admin & Operations">Admin & Operations</option>
            </select>
        </div>

        <div id="jobGrid" class="job-grid">Loading listings...</div>
    </div>

    <script>
        let allJobs = [];

        fetch('jobs.json')
            .then(r => r.json())
            .then(data => { allJobs = data; renderJobs(allJobs); })
            .catch(() => { document.getElementById('jobGrid').innerHTML = '<p>Error loading jobs.</p>'; });

        function renderJobs(jobs) {
            const grid = document.getElementById('jobGrid');
            grid.innerHTML = '';

            if (jobs.length === 0) {
                grid.innerHTML = '<p style="text-align:center; padding: 2rem;">No jobs match your search.</p>';
                return;
            }

            jobs.forEach((j, idx) => {
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <div class="job-top">
                        <div>
                            <h3 class="job-title">${j.title}</h3>
                            <div class="company-name">${j.company}</div>
                        </div>
                    </div>
                    <div class="job-meta">
                        <span class="tag">📍 ${j.city}</span>
                        <span class="tag">🏷️ ${j.category}</span>
                        <span class="tag">🌐 Source: ${j.source}</span>
                    </div>
                    <div class="job-actions">
                        <button class="btn-desc" onclick="toggleDetails(${idx})">📄 Read Summary</button>
                        <a href="${j.url}" target="_blank" class="btn-apply">Apply Direct →</a>
                    </div>
                    <div class="desc-box" id="desc-${idx}">${j.description}</div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleDetails(i) {
            document.getElementById(`desc-${i}`).classList.toggle('active');
        }

        function filterJobs() {
            const kw = document.getElementById('searchKeyword').value.toLowerCase();
            const city = document.getElementById('citySelect').value;
            const cat = document.getElementById('catSelect').value;

            const filtered = allJobs.filter(j => {
                const matchKw = j.title.toLowerCase().includes(kw) || j.company.toLowerCase().includes(kw);
                const matchCity = (city === 'All' || j.city === city);
                const matchCat = (cat === 'All' || j.category === cat);
                return matchKw && matchCity && matchCat;
            });

            renderJobs(filtered);
        }
    </script>
</body>
</html>
